server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server ipv6only=on;

  # Generic default server so the internal hostname does not need to be
  # committed to the image or GitHub repository.
  server_name _;

  ssl_certificate /ssl/fullchain.pem;
  ssl_certificate_key /ssl/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  client_max_body_size 128M;

  # Serve media files.
  location /media {
    alias /opt/recipes/mediafiles;
    add_header Content-Disposition 'attachment; filename="$args"';
  }

  # Serve the service worker under the main path.
  location = /service-worker.js {
    alias /opt/recipes/staticfiles/vue3/service-worker.js;
  }

  # Pass requests for dynamic content to Gunicorn.
  location / {
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_pass http://web_recipes:8080;

    error_page 502 /errors/http502.html;
  }

  location /errors/ {
    alias /etc/nginx/http.d/errorpages/;
    internal;
  }
}
